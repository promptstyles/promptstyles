# Runs on every pull request: validates the taxonomy, the rubric and the signatory files
# against their JSON Schemas, runs the tests and makes sure the site still builds.

name: Validate

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Validate data
        run: npm run validate

      - name: Test
        run: npm test

      - name: Type check
        run: npm run check

      - name: Build the site
        run: npm run build -w @promptstyles/web
