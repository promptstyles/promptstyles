# Monthly, grouped dependency updates so they arrive as one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # astro check supports TypeScript up to 6. Bump by hand when it supports a newer major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types must match the Node.js major in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
